<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your DrivePro Driving School account to access your dashboard and manage your training.">
  <title>Login - DrivePro Driving School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><i class="fas fa-car-side"></i> DrivePro</a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>
        <a href="enquiry.html">Enquiry</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <a href="login.html" class="nav-auth-btn login-btn active" id="navLoginBtn">
          <i class="fas fa-sign-in-alt"></i> Login
        </a>
        <button class="menu-toggle" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- UNIFIED LOGIN -->
  <section class="auth-page">
    <div class="auth-card fade-up">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-sign-in-alt"></i>
        </div>
        <h2>Welcome Back!</h2>
        <p>Login as User or Admin — same form, smart redirect</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" data-validate="email" required>
          <p class="error-message"></p>
        </div>

        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <div class="password-toggle">
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            <i class="toggle-pw fas fa-eye"></i>
          </div>
          <p class="error-message"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Create Account</a></p>
      </div>

      <div class="divider"></div>

      <div style="text-align:center;">
        <p style="color:var(--text-muted);font-size:0.8rem;margin-bottom:10px;">Demo Credentials</p>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <p style="font-size:0.85rem;color:var(--text-secondary);background:var(--bg-secondary);padding:8px 12px;border-radius:8px;">
            <i class="fas fa-user" style="color:var(--primary);"></i> <strong>User:</strong>&nbsp;
            rahul@example.com &nbsp;|&nbsp; rahul123
          </p>
          <p style="font-size:0.85rem;color:var(--text-secondary);background:var(--bg-secondary);padding:8px 12px;border-radius:8px;">
            <i class="fas fa-user-shield" style="color:#ef4444;"></i> <strong>Admin:</strong>&nbsp;
            saurav123@gmail.com &nbsp;|&nbsp; saurav123
          </p>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
