<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your DrivePro Driving School account. Sign up to start your driving training journey.">
  <title>Sign Up - DrivePro Driving School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><i class="fas fa-car-side"></i> DrivePro</a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>
        <a href="enquiry.html">Enquiry</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="menu-toggle" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- SIGNUP -->
  <section class="auth-page">
    <div class="auth-card fade-up" style="max-width:520px;">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-user-plus"></i>
        </div>
        <h2>Create Account</h2>
        <p>Sign up to start your driving journey</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="fullName" class="form-control" placeholder="Enter your full name (letters only)" data-validate="name" required>
          <p class="error-message"></p>
        </div>

        <div class="form-group">
          <label>Mobile Number <span class="required">*</span></label>
          <input type="tel" name="mobile" class="form-control" placeholder="Enter 10-digit mobile number" data-validate="mobile" maxlength="10" required>
          <p class="error-message"></p>
        </div>

        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email address" data-validate="email" required>
          <p class="error-message"></p>
        </div>

        <div class="form-group">
          <label>Password <span class="required">*</span> <small style="color:var(--text-muted)">(min 6 characters)</small></label>
          <div class="password-toggle">
            <input type="password" name="password" class="form-control" placeholder="Create a strong password" data-validate="password" required>
            <i class="toggle-pw fas fa-eye"></i>
          </div>
          <p class="error-message"></p>
        </div>

        <div class="form-group">
          <label>Confirm Password <span class="required">*</span></label>
          <div class="password-toggle">
            <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter your password" required>
            <i class="toggle-pw fas fa-eye"></i>
          </div>
          <p class="error-message"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login Here</a></p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
